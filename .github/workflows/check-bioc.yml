name: R-CMD-check-bioc

on:
  push:
    branches: [devel, master, main, 'RELEASE_*']
  pull_request:
    branches: [devel, master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.bioc }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  bioc: 'release', r: 'release' }
          - { os: ubuntu-latest,  bioc: 'devel',   r: 'devel'   }
          - { os: macos-latest,   bioc: 'release', r: 'release' }
          - { os: windows-latest, bioc: 'release', r: 'release' }

    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.r == 'devel' && 'release' || 'default' }}
          use-public-rspm: true

      - name: Configure R for rJava
        if: runner.os != 'Windows'
        run: sudo R CMD javareconf || R CMD javareconf
        shell: bash

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install BiocManager
        run: |
          install.packages("BiocManager")
          BiocManager::install(version = "${{ matrix.config.bioc }}", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::BiocCheck
            any::covr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

      - name: BiocCheck
        run: BiocCheck::BiocCheck(".", `quit-with-status` = TRUE, `no-check-bioc-views` = TRUE, `no-check-bioc-help` = TRUE)
        shell: Rscript {0}

      - name: Test coverage
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.bioc == 'release'
        run: covr::codecov(quiet = FALSE)
        shell: Rscript {0}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
